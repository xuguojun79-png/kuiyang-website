<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>护理日记｜口腔溃疡陪伴式康复系统</title>
  <meta name="description" content="记录口腔溃疡期间的疼痛、睡眠和压力，数据保存在浏览器本地，可随时删除。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tracker">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html"><span class="brand-mark">愈</span>愈口 21天陪伴</a>
      <button class="nav-toggle" type="button" aria-expanded="false">菜单</button>
      <nav class="site-nav">
        <a href="index.html" data-nav="home">首页</a>
        <a href="plan.html" data-nav="plan">21天计划</a>
        <a href="self-check.html" data-nav="check">自查</a>
        <a href="tracker.html" data-nav="tracker">日记</a>
        <a href="report.html" data-nav="report">周报</a>
        <a href="wiki.html" data-nav="wiki">百科</a>
        <a href="diet.html" data-nav="diet">饮食</a>
        <a href="community.html" data-nav="community">社区</a>
        <a href="about.html" data-nav="about">关于</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container page-head">
      <h1>护理日记</h1>
      <p class="lead">分数越高代表程度越强。写完后可到<a href="report.html">周报</a>查看均分和趋势。</p>
    </div>
    <section class="section">
      <div class="container grid grid-2">
        <form class="card" id="tracker-form">
          <div class="field">
            <label for="log-date">日期</label>
            <input id="log-date" type="date" required>
          </div>
          <div class="field">
            <label for="log-pain">疼痛（1-10）</label>
            <input id="log-pain" type="number" min="1" max="10" value="5" required>
          </div>
          <div class="field">
            <label for="log-sleep">睡眠质量（1-10）</label>
            <input id="log-sleep" type="number" min="1" max="10" value="6" required>
          </div>
          <div class="field">
            <label for="log-stress">压力（1-10）</label>
            <input id="log-stress" type="number" min="1" max="10" value="5" required>
          </div>
          <div class="field">
            <label for="log-note">备注（可选）</label>
            <textarea id="log-note" placeholder="今天吃了什么、是否熬夜、溃疡位置变化……"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">保存记录</button>
        </form>
        <div>
          <h2>历史记录</h2>
          <div id="log-list"></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> 口腔溃疡21天陪伴式康复系统</p>
      <p><a href="about.html">关于本站</a> · <a href="wiki.html">健康百科</a> · <a href="plan.html">康复计划</a></p>
      <p class="disclaimer">本站内容仅供健康科普参考，不能替代专业医疗诊断。如有严重症状或持续不愈，请及时就医。</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/tracker.js"></script>
</body>
</html>
